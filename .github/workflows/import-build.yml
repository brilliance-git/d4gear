name: Import Mobalytics build

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Mobalytics build guide URL (e.g. https://mobalytics.gg/diablo-4/builds/necromancer-mages-necro-guide)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add or update the build
        run: node bin/generate-web-data.js "${{ inputs.url }}" --out web/data.js

      - name: Commit and push if data.js changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data.js
          if git diff --cached --quiet; then
            echo "No changes to commit (build already up to date)."
            exit 0
          fi
          git commit -m "Import build from Mobalytics" -m "Source: ${{ inputs.url }}"
          git push
